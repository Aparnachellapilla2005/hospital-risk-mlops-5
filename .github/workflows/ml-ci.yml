
name: Hospital Risk ML CI-CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  train-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install ML dependencies
        run: pip install -r requirements.txt

      - name: Train Hospital Risk model
        run: python train_model.py

      - name: Run quality gate
        run: python quality_gate.py

      - name: Run automated ML and API tests
        run: python -m unittest discover -v

      - name: Prepare release candidate
        run: |
          mkdir -p release-candidate
          cp app.py release-candidate/
          cp hospital_risk_model.pkl release-candidate/
          cp metrics.json release-candidate/
          cp requirements.txt release-candidate/
          printf '%s\n' \
            'Hospital Risk Prediction - Release Candidate' \
            'Model: hospital_risk_model.pkl' \
            'Validation: quality gate and automated tests passed' \
            > release-candidate/DEPLOYMENT.txt

      - name: Upload release candidate
        uses: actions/upload-artifact@v4
        with:
          name: hospital-risk-ml-release
          path: release-candidate/
          if-no-files-found: error
