
name: Hospital Risk ML CI

on:
  push:
    branches:
      - main
      - practical-12-monitoring
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  train-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install ML dependencies
        run: pip install -r requirements.txt

      - name: Train hospital risk model
        run: python train_model.py

      - name: Check ML quality gate
        run: python quality_gate.py

      - name: Run automated ML tests
        run: python -m unittest discover -v

      - name: Upload validated ML artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hospital-risk-ml-artifacts
          path: |
            hospital_risk_model.pkl
            metrics.json
            hospital_data.csv
          if-no-files-found: error
          retention-days: 7
