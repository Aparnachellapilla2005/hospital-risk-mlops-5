
name: Hospital Risk ML CI-CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read

jobs:
  train-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install ML dependencies
        run: pip install -r requirements.txt

      - name: Train Hospital Risk model
        run: python train_model.py

      - name: Run quality gate
        run: python quality_gate.py

      - name: Run automated ML and API tests
        run: python -m unittest discover -v
        
      - name: Build Docker image
        run: docker build -t hospital-risk-ml:${{ github.sha }} .

      - name: Start Docker container
        run: |
          docker run -d \
            --name hospital-risk-ml-container \
            -p 5000:5000 \
            hospital-risk-ml:${{ github.sha }}

      - name: Wait for application to become ready
        run: |
          for i in {1..15}; do
            if curl --fail --silent http://localhost:5000/health; then
              echo "Application is ready."
              exit 0
            fi
            echo "Waiting for application... attempt $i"
            sleep 2
          done

          echo "Application did not become ready."
          docker logs hospital-risk-ml-container || true
          exit 1

      - name: Test prediction endpoint
        run: |
          response=$(curl --fail --silent --show-error \
            -X POST \
            -H "Content-Type: application/json" \
            -d '{"Age":80,"Gender":"Male","Height_cm":170,"Weight_kg":110,"BP":"High","Cholesterol":300,"Glucose":200,"Smoking":"Yes","ExerciseLevel":"Low","BMI":38.1}' \
            http://localhost:5000/predict)

          echo "Prediction response: $response"
          echo "$response" | grep -q '"prediction"'

      - name: Show Docker container logs
        if: always()
        run: docker logs hospital-risk-ml-container || true

      - name: Stop and remove Docker container
        if: always()
        run: docker rm -f hospital-risk-ml-container || true

      - name: Prepare release candidate
        run: |
          mkdir -p release-candidate
          cp app.py release-candidate/
          cp hospital_risk_model.pkl release-candidate/
          cp metrics.json release-candidate/
          cp requirements.txt release-candidate/
          cp Dockerfile release-candidate/
          cp .dockerignore release-candidate/
          printf '%s\n' \
            'Hospital Risk Prediction ML Application' \
            'Run: python app.py' \
            'Health endpoint: GET /health' \
            'Prediction endpoint: POST /predict' \
            'Container port: 5000' \
            > release-candidate/DEPLOYMENT.txt

      
      - name: Upload release candidate
        uses: actions/upload-artifact@v4
        with:
          name: hospital-risk-ml-release
          path: release-candidate/
          if-no-files-found: error
          include-hidden-files: true
